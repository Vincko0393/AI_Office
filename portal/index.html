<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bar Demo Linz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: celá obrazovka je 3D bar. Navrchu značka a hodiny, vľavo lišta (šéf, úlohy, denník),
   vpravo (na mobile zdola) panel s funkciami. Vedome jeden tmavý vzhľad ako herné UI. */
:root{
  --ink:#f1ebdf; --ink-2:#bdb4a4; --ink-3:#8a8273;
  --card:#100f0e; --card-2:#1a1815; --card-3:#25221d; --line:#3a3226;
  --go:#c9a45c; --go-ink:#17130b; --live:#4fd1a1; --warn:#e2b764; --bad:#e8705f; --info:#8ec5f0;
  --f-serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#0b0a0d;color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}

#app{position:fixed;inset:0;background:var(--sky,linear-gradient(180deg,#0c0a10,#1a1418));transition:background 2s}
#stage{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}

/* horná lišta */
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:var(--gutter-l);right:var(--gutter-r);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none;z-index:4}
.brand{pointer-events:auto;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;gap:2px}
.brand h1{font:700 24px/1 var(--f-serif);letter-spacing:.01em;color:var(--go)}
.brand span{font:500 10px var(--f-mono);color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.clock{pointer-events:auto;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:right;font:500 12px var(--f-mono);color:var(--ink-2)}
.clock b{display:block;font:700 22px/1.1 var(--f-serif);color:var(--ink)}

/* ľavá lišta */
.rail{position:absolute;left:var(--gutter-l);top:50%;transform:translateY(-50%);display:grid;gap:8px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:4}
.rail button{width:48px;height:48px;border-radius:12px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;position:relative}
.rail button:hover,.rail button[aria-pressed="true"]{background:var(--card-3);color:var(--go)}
.rail svg{width:22px;height:22px}
.rail .n{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--go);color:var(--go-ink);font:700 10px/17px var(--f-mono);padding:0 4px}
.rail .lbl{position:absolute;left:58px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}
.rail button:hover .lbl{opacity:1}
@media (max-width:640px){
  .rail{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);grid-auto-flow:column}
  .rail .lbl{display:none}
}

/* menovky a karty nad postavami */
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--card) 92%,transparent);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 7px;font:600 12px var(--f-body);white-space:nowrap;cursor:pointer;z-index:2}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.tag i.working{background:var(--live);animation:ping 1.6s infinite}
.tag i.error{background:var(--bad);animation:ping 1s infinite}
.tag i.done{background:var(--info)}
.tag em{font-style:normal;font:700 10px var(--f-mono);background:var(--go);color:var(--go-ink);border-radius:6px;padding:0 5px}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 0%,var(--live))}100%{box-shadow:0 0 0 7px transparent}}
.pop{position:absolute;left:0;top:0;width:min(310px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:3}
.pop .top2{display:flex;gap:10px;align-items:flex-start}
.face{width:42px;height:42px;border-radius:11px;background:#0c100f;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.face b{display:block;width:22px;height:8px;background:radial-gradient(circle at 4px 4px,var(--c,#5ff2d0) 3.5px,transparent 4px),radial-gradient(circle at 18px 4px,var(--c,#5ff2d0) 3.5px,transparent 4px)}
.pop .t{font:700 20px/1.1 var(--f-serif);min-width:0;overflow-wrap:anywhere}
.sub{display:flex;gap:8px;align-items:center;font:500 12px var(--f-mono);color:var(--ink-3);margin-top:4px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:5px;background:var(--card-3);border-radius:6px;padding:1px 7px;color:var(--ink)}
.st::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,#8a948e)}
.x{margin-left:auto;background:var(--card-3);border:0;width:30px;height:30px;border-radius:50%;flex:none;color:var(--ink)}
.prog{height:5px;background:var(--card-3);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,#8a948e)}
.prog i.run{animation:run 2.4s ease-in-out infinite alternate}
@keyframes run{from{width:30%}to{width:85%}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{border-radius:10px;padding:10px;font-weight:700;border:1px solid var(--line);background:var(--card-2)}
.acts button.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.what{font-size:14px;color:var(--ink-2)}

/* panel s funkciami */
.sheet{position:absolute;z-index:5;top:calc(84px + env(safe-area-inset-top,0px));right:var(--gutter-r);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font:700 24px/1.1 var(--f-serif);min-width:0}
.sheet-body{overflow-y:auto;padding:14px;display:grid;gap:14px;align-content:start;min-width:0}
@media (max-width:640px){
  .sheet{top:auto;left:0;right:0;bottom:0;width:auto;max-height:78%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet-head{padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
  .sheet-body{padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
}
.note{font-size:13px;color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--go);color:var(--go-ink);border-color:var(--go)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
input,select,textarea{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.btn{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:9px 15px;font-weight:700}
.btn.primary{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink-2);text-align:left}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font:500 12px/1.6 var(--f-mono);white-space:nowrap;background:var(--card-3)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pracujem,.s-nova{color:var(--info)}
.s-hotove,.s-schvalene{color:var(--live)}
.s-chyba{color:var(--bad)}
.s-na-schvalenie,.s-prepisat{color:var(--warn)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;background:var(--card-2);min-width:0}
.item .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .title{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item img,.item video{max-width:100%;max-height:200px;border-radius:8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meter{display:grid;gap:4px;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--card-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--ink-3);font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.answer{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
a{color:var(--info)}
.toast{position:absolute;z-index:9;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));background:var(--go);color:var(--go-ink);padding:10px 16px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:600 italic 26px var(--f-serif);color:var(--go);z-index:8;pointer-events:none}
.fallback{position:absolute;inset:auto 16px 50% 16px;text-align:center;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <div id="stage" aria-label="3D bar: the head bartender and the waiters at work"></div>
  <div class="loading" id="loading">Opening the bar…</div>

  <header class="hud">
    <div class="brand">
      <h1 id="biz-name">Bar Demo Linz</h1>
      <span>Fictional venue · sample data</span>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="open-state">Linz</span></div>
  </header>

  <nav class="rail" aria-label="Bar menu">
    <button type="button" data-sheet="boss" aria-pressed="false" aria-label="Head bartender">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-7 8v5l3 2H8l3-2v-5z"/><path d="M8 9h8"/></svg>
      <span class="lbl">Head bartender</span>
    </button>
    <button type="button" data-sheet="queue" aria-pressed="false" aria-label="Tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      <span class="n" id="q-badge" hidden>0</span>
      <span class="lbl">Tasks for the waiters</span>
    </button>
    <button type="button" data-sheet="log" aria-pressed="false" aria-label="Agent log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h10l3 3v15H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>
      <span class="lbl">Agent log</span>
    </button>
    <button type="button" id="recenter" aria-label="Show the whole bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      <span class="lbl">Whole bar</span>
    </button>
  </nav>

  <aside class="sheet" id="sheet" hidden aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div class="face" id="sheet-face"><b></b></div>
      <h2 id="sheet-title"></h2>
      <button class="x" type="button" id="sheet-close" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>
  <div class="toast" id="toast" hidden role="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// POMOCNÍCI
// =====================================================================
const $ = (s) => document.querySelector(s);
// h(): bezpečne vytvorí HTML prvok; text sa nikdy nevkladá ako kód
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const slug = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "-");
// stavy sa v databáze ukladajú po slovensky, na obrazovke sú po anglicky
const STAV_EN = { "nová": "new", "pracujem": "in progress", "hotové": "done", "chyba": "error", "na schválenie": "awaiting approval", "schválené": "approved", "prepísať": "rewrite" };
const pill = (stav) => h("span", { class: "pill s-" + slug(stav) }, STAV_EN[stav] || stav || "–");
function fmtTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso || "";
  return d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function ago(iso) {
  const d = new Date(iso); if (!iso || isNaN(d)) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 2) return "just now"; if (m < 60) return `${m} min ago`;
  if (m < 60 * 24) return `${Math.round(m / 60)} h ago`; return fmtTime(iso);
}
function today(offset = 0) { const d = new Date(); d.setDate(d.getDate() + offset); return d.toISOString().slice(0, 10); }
function skDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; }
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
}

// =====================================================================
// ČAŠNÍCI A ICH FUNKCIE
// =====================================================================
const STAFF = ["Lena", "Tobias", "Jonas", "Mira", "Emil", "Sara", "Felix", "Nina"]; // vymyslení zamestnanci
const STOCK = ["Lemons", "Limes", "Aperol", "Prosecco", "Tonic", "Milk", "Coffee beans", "Beer (keg)"];
const BOTS = [
  { id: "n8n", name: "n8n Automations", zone: "Automation desk", accent: 0x3fc8a0, css: "#3fc8a0", status: "Shift checklist at 3 pm, stock alert at 10 am, error watch.",
    actions: [{ id: "uloha", label: "Shift tasks" }, { id: "inventura", label: "Stock count" }, { id: "chyby", label: "Error watch" }] },
  { id: "smeny", name: "Shift Planner", zone: "Rota board", accent: 0xe2b764, css: "#e2b764", status: "Rota for 2 – 8 Nov is waiting for approval.",
    actions: [{ id: "choroba", label: "Report sick leave" }, { id: "event", label: "Add an event" }, { id: "subor", label: "Upload a file" }] },
  { id: "marketing", name: "Marketing", zone: "Photo corner", accent: 0xe07a52, css: "#e07a52", status: "Turns a photo or video into a post for approval.",
    actions: [{ id: "prispevok", label: "New post" }, { id: "schvalenie", label: "Awaiting approval" }] },
  { id: "analytik", name: "Data Analyst", zone: "Office", accent: 0x8ec5f0, css: "#8ec5f0", status: "Sales reports. On hold for now.",
    actions: [{ id: "report", label: "Request a report" }] },
  { id: "pr", name: "PR", zone: "Stage", accent: 0xb98ae0, css: "#b98ae0", status: "Press releases and media relations.",
    actions: [{ id: "pr", label: "New request" }] },
];
const botById = (id) => BOTS.find((b) => b.id === id);
const STATE_UI = { working: ["Working", "#4fd1a1"], error: ["Error", "#e8705f"], done: ["Done", "#8ec5f0"], idle: ["Idle", "#8a8273"] };
const CLOSED = ["hotové", "schválené"];

// =====================================================================
// STAV STRÁNKY (plní sa z databázy portálu)
// =====================================================================
let db = null, assets = null, sample = null;
let tasks = [], botDocs = {}, logRows = [];
let logFilter = "All";
let sheet = null; // { kind: "boss" | "bot" | "queue" | "log", bot, action }
let sceneRefresh = () => {}, focusActor = () => {};

// stav čašníka: otvorené úlohy z fronty, inak posledný riadok denníka
const AGENT_KEY = { n8n: "n8n", smeny: "smien", marketing: "marketing", analytik: "analytik", pr: "pr" };
function botStatus(botId) {
  const key = AGENT_KEY[botId];
  const log = logRows.find((r) => { const a = slug(r.agent); return botId === "pr" ? a === "pr" : a.includes(key); });
  const open = tasks.filter((t) => t.bot === botId && !CLOSED.includes(t.stav));
  const err = open.find((t) => t.stav === "chyba");
  const working = open.find((t) => t.stav === "pracujem") || open[0];
  let state = "idle", title, when;
  if (err) { state = "error"; title = err.nazov; when = err.zmenene || err.vytvorene; }
  else if (working) { state = "working"; title = working.nazov; when = working.zmenene || working.vytvorene; }
  else if (log) { state = log.stav === "chyba" ? "error" : log.stav === "pracujem" ? "working" : "done"; title = log.co; when = log.cas; }
  return { state, title: title || botById(botId).status, when, open: open.length, log };
}

// =====================================================================
// PANEL (šéf, funkcie čašníka, úlohy, denník)
// =====================================================================
function openSheet(next) {
  sheet = next;
  document.querySelectorAll(".rail [data-sheet]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sheet === next.kind)));
  renderSheet(next.prefill);
  $("#sheet").hidden = false;
  if (next.kind === "bot") focusActor(next.bot);
  if (next.kind === "boss") focusActor("boss");
}
function closeSheet() {
  sheet = null; $("#sheet").hidden = true;
  document.querySelectorAll(".rail [data-sheet]").forEach((b) => b.setAttribute("aria-pressed", "false"));
}
// obnoví panel po zmene dát, ale nikdy nezmaže rozpísaný formulár
function sheetLive() {
  if (!sheet) return;
  if (sheet.kind === "queue" || sheet.kind === "log") renderSheet();
  if (sheet.kind === "bot" && ["schvalenie", "chyby"].includes(sheet.action)) renderSheet();
}
function renderSheet(prefill) {
  const body = $("#sheet-body"), face = $("#sheet-face");
  if (sheet.kind === "boss") {
    $("#sheet-title").textContent = "Head bartender"; face.style.setProperty("--c", "#f2b84b");
    body.replaceChildren(...bossView());
  } else if (sheet.kind === "bot") {
    const b = botById(sheet.bot);
    $("#sheet-title").textContent = b.name; face.style.setProperty("--c", b.css);
    const st = botStatus(b.id), [label, color] = STATE_UI[st.state];
    body.replaceChildren(
      h("div", { class: "sub" }, h("span", { class: "st", style: `--c:${color}` }, label), h("span", {}, b.zone), st.open ? h("span", {}, `${st.open} open`) : null),

// ---------- zápis do databázy ----------
async function uploadFile(file, type) {
  if (!assets) { toast("File upload is not available."); return null; }
  if (file.size > 20 * 1024 * 1024) { toast("The file is larger than 20 MB."); return null; }
  try {
    toast("Uploading…");
    const r = await assets.upload(file, type ? { type } : undefined);
    return { id: r.id, meno: file.name, typ: r.contentType, velkost: r.sizeBytes };
  } catch (e) { toast("Upload failed (" + (e.code || "error") + ")."); return null; }
}
async function createTask(bot, akcia, nazov, data, form, subor) {
  if (!db) return toast("Saving is not available. Open the portal while signed in to claude.ai.");
  const btn = form?.querySelector("button.primary"); if (btn) btn.disabled = true;
  try {
    await db.collection("ulohy").add({ bot, akcia, nazov, data, subor: subor || null, stav: "nová", vytvorene: new Date().toISOString() });
    toast(`Sent to ${botById(bot).name}`);
    form?.reset();
  } catch (e) { toast(e.code === "invalid_argument" ? "You do not have permission to save." : "Could not save, please try again."); }
  finally { if (btn) btn.disabled = false; }
}
async function setStav(t, stav, poznamka) {
  try {
    await db.doc("ulohy/" + t.id).update({ stav, ...(poznamka ? { poznamka_majitela: poznamka } : {}), zmenene: new Date().toISOString() });
    toast("Status: " + (STAV_EN[stav] || stav));
  } catch { toast("Could not change the status."); }
}

function initWorld() {
  const stage = $("#stage");
  if (!window.THREE) throw new Error("three.js did not load");
  const T = THREE;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // --- vykresľovač ---
  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(1.75, devicePixelRatio || 1));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(30, 1, 1, 400);
  const world = new T.Group(); scene.add(world);

  // --- materiály a pomocníci ---
  const matCache = {};
  const std = (c, o = {}) => { const k = c + JSON.stringify(o); return matCache[k] || (matCache[k] = new T.MeshStandardMaterial({ color: c, roughness: 0.6, metalness: 0.05, ...o })); };
  const glossy = (c, o = {}) => new T.MeshPhysicalMaterial({ color: c, roughness: 0.32, metalness: 0.05, clearcoat: 0.7, clearcoatRoughness: 0.25, ...o });
  const glow = (c, i = 1.4) => new T.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i, roughness: 0.4 });
  function add(geo, mat, x = 0, y = 0, z = 0, parent = world, shadow = true) {
    const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
  }
  const grp = (parent = world, x = 0, y = 0, z = 0) => { const g = new T.Group(); g.position.set(x, y, z); parent.add(g); return g; };
  function canvasTex(w, hh, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = hh;
    draw(c.getContext("2d"), w, hh);
    const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4; return t;
  }
  const font = (px, w = 700) => `${w} ${px}px Figtree, system-ui, sans-serif`;

  // drevená podlaha
  const woodTex = canvasTex(512, 512, (g, w, hh) => {
    const tones = ["#3b2416", "#341f12", "#43291a", "#2e1b10", "#3f2617"];
    for (let y = 0; y < hh; y += 32) {
      let x = -((y / 32) % 3) * 70;
      while (x < w) {
        const len = 140 + ((x * 7 + y) % 90);
        g.fillStyle = tones[Math.abs((x + y * 3) / 17 | 0) % tones.length]; g.fillRect(x, y, len, 32);

        if (reduce) continue;
        a.wait -= dt;
        if (a.wait <= 0 && Math.abs(a.angT - a.ang) < 0.02) { a.angT = entryDir + 0.8 + Math.random() * (Math.PI * 2 - 1.6); a.wait = 3 + Math.random() * 4; }
        const diff = a.angT - a.ang, step = Math.sign(diff) * Math.min(Math.abs(diff), dt * 0.5);
        a.ang += step;
        a.root.position.set(Math.cos(a.ang) * 1.42, 0.25, Math.sin(a.ang) * 1.42);
        a.root.rotation.y = Math.atan2(Math.cos(a.ang), Math.sin(a.ang));
        if (Math.abs(step) > 0.0005) walkLegs(a, t, 8, 0.35); else idleLegs(a);
        const shaking = Math.abs(step) <= 0.0005 && Math.sin(t * 0.7) > 0.3;
        a.arms[1].rotation.x = shaking ? -2.4 + Math.sin(t * 22) * 0.35 : a.arms[1].rotation.x * 0.9;
        a.head.rotation.y = Math.sin(t * 0.6) * 0.3;
        continue;
      }
      const working = a.state === "working" && !reduce;
      a.tray.visible = working;
      if (working) {
        // nosí tácku medzi stanovišťom a pultom
        a.phase += dt * 0.16;
        const k = (1 - Math.cos(a.phase * Math.PI)) / 2;
        tmp.lerpVectors(a.work, a.deliver, k);
        const goingToBar = Math.sin(a.phase * Math.PI) >= 0;
        const dest = goingToBar ? a.deliver : a.work;
        a.root.position.set(tmp.x, 0.25 + Math.abs(Math.sin(t * 8)) * 0.05, tmp.z);
        faceTo(a, dest.x, dest.z, 0.2);
        a.arms[1].rotation.x = -1.35;
        const atEnd = k < 0.03 || k > 0.97;
        if (atEnd) idleLegs(a); else walkLegs(a, t, 8, 0.5);
      } else if (!reduce) {
        // voľno: prechádza sa po svojom šesťuholníku
        if (!a.target || a.root.position.distanceTo(a.target) < 0.12) {
          a.wait = (a.wait ?? 0) - dt; idleLegs(a);
          a.root.position.y = 0.25;
          a.head.rotation.y = Math.sin(t * 0.8 + a.zone.x) * 0.5;
          if (a.wait <= 0) { a.wait = 1.5 + Math.random() * 3; const ang = Math.random() * Math.PI * 2, rr = 0.6 + Math.random() * 1.3; a.target = tmp2.set(Math.cos(ang) * rr, 0, Math.sin(ang) * rr).add(a.zone).addScaledVector(new T.Vector3(-a.zone.x, 0, -a.zone.z).normalize(), 0.7).setY(0.25).clone(); }
        } else {
          tmp.copy(a.target).sub(a.root.position).setY(0); const len = tmp.length();
          tmp.multiplyScalar(Math.min(len, dt * 1.0) / len);
          a.root.position.add(tmp); a.root.position.y = 0.25 + Math.abs(Math.sin(t * 7)) * 0.04;
          faceTo(a, a.target.x, a.target.z, 0.18); walkLegs(a, t, 7, 0.42); a.head.rotation.y *= 0.9;
        }
        a.arms[1].rotation.x *= 0.9;
      } else { a.root.position.copy(a.work); }
      // svetielko na anténe ukazuje stav
      if (a.bulb) {
        const col = a.state === "error" ? 0xff4b3b : a.state === "working" ? 0x3ddc97 : a.bot.accent;
        a.bulb.material.color.setHex(col); a.bulb.material.emissive.setHex(col);
        a.bulb.material.emissiveIntensity = a.state === "error" ? (Math.sin(t * 9) > 0 ? 2.5 : 0.2) : a.state === "working" ? 1.6 + Math.sin(t * 4) * 0.6 : 0.8;
      }
    }
    // hostia pri stoloch
    for (const g of guests) {
      if (reduce) break;
      const s = Math.sin(t * 0.9 + g.phase);
      g.arms[1].rotation.x = s > 0.85 ? -1.6 : g.arms[1].rotation.x * 0.92;
      g.head.rotation.y = Math.sin(t * 0.5 + g.phase) * 0.4;
      g.g.position.y = -0.18 + Math.max(0, Math.sin(t * 3 + g.phase)) * 0.02;
    }

    renderer.render(scene, cam);
    if (first) { first = false; $("#loading").hidden = true; }

    // menovky a karta sledujú postavy
    const W = stage.clientWidth, H = stage.clientHeight;
    for (const a of actors) {
      a.root.getWorldPosition(tmp); tmp.y += a.boss ? 3.55 : 2.75;
      tmp.project(cam);
      const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
      a.sx = (tmp.x + 1) / 2 * W; a.sy = (1 - tmp.y) / 2 * H;
      a.tag.style.transform = `translate(${a.sx}px,${a.sy}px) translate(-50%,-100%)`;
      a.tag.style.visibility = vis ? "visible" : "hidden";
    }
    if (popId) {
      const a = actors.find((q) => q.id === popId);
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      const x = Math.max(16, Math.min(W - pw - 16, a.sx - pw / 2)), y = Math.max(80, Math.min(H - ph - 16, a.sy - ph - 30));
      pop.style.transform = `translate(${x}px,${y}px)`;
    }
    requestAnimationFrame(frame);
  }
  frame();
}

// =====================================================================
// HODINY, DÁTA A ŠTART
// =====================================================================
function tick() {
  $("#clock").textContent = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Vienna" }).format(new Date());
}
tick(); setInterval(tick, 20000);

try { initWorld(); }
catch (e) {
  console.error("3D:", e);
  $("#loading").hidden = true;
  $("#stage").append(h("div", { class: "fallback" }, h("p", {}, "The 3D bar could not load on this device."), h("p", { class: "note" }, "Use the side bar: head bartender, tasks and agent log.")));
}

function onData() {
  const open = tasks.filter((t) => !CLOSED.includes(t.stav)).length;
  $("#q-badge").hidden = !open; $("#q-badge").textContent = open;
  sceneRefresh(); sheetLive();
}
(async () => {
  [db, assets, sample] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("sample")]);
  if (!db) return onData();
  const err = () => {};
  db.collection("ulohy").orderBy("vytvorene", "desc").limit(200).onSnapshot((s) => { tasks = s.docs.map((d) => ({ id: d.id, ...d.data() })); onData(); }, err);
  db.collection("boti").onSnapshot((s) => { botDocs = Object.fromEntries(s.docs.map((d) => [d.id, d.data()])); onData(); }, err);
  db.collection("dennik").orderBy("cas", "desc").limit(300).onSnapshot((s) => { logRows = s.docs.map((d) => ({ id: d.id, ...d.data() })); onData(); }, err);
  const firma = await db.doc("firma/profil").get().catch(() => null);
  if (firma?.exists && firma.data().nazov) $("#biz-name").textContent = firma.data().nazov;
})();
</script>
